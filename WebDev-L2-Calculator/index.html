<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator" aria-label="Calculator">
    <div class="case">
      <span class="rivet rivet--tl" aria-hidden="true"></span>
      <span class="rivet rivet--tr" aria-hidden="true"></span>
      <span class="rivet rivet--bl" aria-hidden="true"></span>
      <span class="rivet rivet--br" aria-hidden="true"></span>

      <header class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">MODEL&nbsp;01</span>
      </header>

      <section class="display" role="status" aria-live="polite">
        <p class="display__history" id="history">&nbsp;</p>
        <p class="display__value" id="display">0</p>
      </section>

      <section class="keypad" aria-label="Calculator keys">
        <button class="key key--func" data-action="clear">AC</button>
        <button class="key key--func" data-action="backspace">⌫</button>
        <button class="key key--func" data-action="percent">%</button>
        <button class="key key--op" data-action="operator" data-op="÷">÷</button>

        <button class="key key--num" data-action="number" data-num="7">7</button>
        <button class="key key--num" data-action="number" data-num="8">8</button>
        <button class="key key--num" data-action="number" data-num="9">9</button>
        <button class="key key--op" data-action="operator" data-op="×">×</button>

        <button class="key key--num" data-action="number" data-num="4">4</button>
        <button class="key key--num" data-action="number" data-num="5">5</button>
        <button class="key key--num" data-action="number" data-num="6">6</button>
        <button class="key key--op" data-action="operator" data-op="−">−</button>

        <button class="key key--num" data-action="number" data-num="1">1</button>
        <button class="key key--num" data-action="number" data-num="2">2</button>
        <button class="key key--num" data-action="number" data-num="3">3</button>
        <button class="key key--op" data-action="operator" data-op="+">+</button>

        <button class="key key--func" data-action="sign">±</button>
        <button class="key key--num" data-action="number" data-num="0">0</button>
        <button class="key key--func" data-action="decimal">.</button>
        <button class="key key--equals" data-action="equals">=</button>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
