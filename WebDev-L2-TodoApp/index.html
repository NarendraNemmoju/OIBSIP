<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A modern and responsive Todo List application built using HTML, CSS and JavaScript."
    >

    <title>TaskFlow | Todo App</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="app-header">

            <div class="brand">
                <div class="brand-icon">
                    ✓
                </div>

                <div>
                    <h1>TaskFlow</h1>
                    <p>Organize your day, one task at a time.</p>
                </div>
            </div>

            <div class="date-display" id="currentDate">
                <!-- Date inserted by JavaScript -->
            </div>

        </header>


        <!-- Main Card -->
        <section class="todo-card">

            <!-- Add Task -->
            <div class="task-input-wrapper">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    maxlength="100"
                    autocomplete="off"
                >

                <button
                    id="addTaskBtn"
                    class="add-btn"
                    type="button"
                >
                    <span>+</span>
                    Add Task
                </button>

            </div>


            <!-- Task Statistics -->
            <div class="task-summary">

                <div class="summary-item">
                    <span class="summary-number" id="totalTasks">
                        0
                    </span>

                    <span class="summary-label">
                        Total
                    </span>
                </div>


                <div class="summary-item">
                    <span class="summary-number" id="activeTasks">
                        0
                    </span>

                    <span class="summary-label">
                        Active
                    </span>
                </div>


                <div class="summary-item">
                    <span class="summary-number" id="completedTasks">
                        0
                    </span>

                    <span class="summary-label">
                        Completed
                    </span>
                </div>

            </div>


            <!-- Toolbar -->
            <div class="toolbar">

                <div class="filter-buttons">

                    <button
                        class="filter-btn active"
                        data-filter="all"
                        type="button"
                    >
                        All
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="active"
                        type="button"
                    >
                        Active
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="completed"
                        type="button"
                    >
                        Completed
                    </button>

                </div>


                <button
                    id="clearCompletedBtn"
                    class="clear-btn"
                    type="button"
                >
                    Clear Completed
                </button>

            </div>


            <!-- Todo List -->
            <div class="todo-list-container">

                <ul id="todoList" class="todo-list">
                    <!-- Tasks generated by JavaScript -->
                </ul>


                <!-- Empty State -->
                <div
                    id="emptyState"
                    class="empty-state"
                >

                    <div class="empty-icon">
                        ✓
                    </div>

                    <h2 id="emptyTitle">
                        No tasks yet
                    </h2>

                    <p id="emptyMessage">
                        Add your first task and start getting things done.
                    </p>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer class="app-footer">
            <p>
                Built with
                <span>HTML</span>,
                <span>CSS</span> &
                <span>JavaScript</span>
            </p>

            <p>
                OIBSIP Web Development
            </p>
        </footer>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
